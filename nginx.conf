server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page-ish app but no client-side routing (tabs are toggled by JS,
    # not the URL), so a plain static lookup is enough — no SPA fallback needed.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/javascript text/css text/plain application/xml image/svg+xml;

    # Vite's hashed build output (assets/*-<hash>.js/css) — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The generated dataset — bind-mounted from public/ on the host (see
    # docker-compose.yml). Content changes whenever the data is refreshed, so
    # never cache it.
    location ~ ^/(kg-data\.json|kg-keywords\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html itself — never cache, so a redeployed app is picked up
    # immediately without a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
