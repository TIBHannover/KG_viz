<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Energy Knowledge Graph · Adaptive Topology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0a09;
      --bg-2: #131110;
      --bg-3: #1b1816;
      --line: #2a2623;
      --line-2: #3a3530;
      --ink: #ece7df;
      --ink-2: #b3aca0;
      --ink-3: #6e6860;
      --amber: oklch(0.78 0.15 65);
      --amber-soft: oklch(0.78 0.15 65 / 0.18);
      --teal: oklch(0.78 0.10 200);
      --grid: rgba(255, 240, 220, 0.025);
      --grid-strong: rgba(255, 240, 220, 0.05);
      --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
      font-family: "Space Grotesk", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); }
    body {
      background-image:
        radial-gradient(1200px 600px at 80% -10%, oklch(0.30 0.06 65 / 0.25), transparent 60%),
        radial-gradient(900px 500px at 0% 110%, oklch(0.30 0.05 200 / 0.18), transparent 55%);
      background-attachment: fixed;
    }
    /* tiny grain */
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 3px 3px;
      mix-blend-mode: overlay;
      opacity: 0.35;
    }

    #app { position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; }

    /* ---------- Header ---------- */
    header.app-head {
      display:flex; align-items:center; justify-content:space-between;
      padding: 18px 28px 10px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display:flex; align-items:center; gap:14px;
    }
    .brand-mark {
      width:34px; height:34px; border-radius:8px;
      background: conic-gradient(from 200deg, var(--amber), var(--teal), var(--amber));
      position:relative;
    }
    .brand-mark::after {
      content:""; position:absolute; inset:5px; border-radius:5px; background: var(--bg);
    }
    .brand-mark::before {
      content:""; position:absolute; inset:11px; border-radius:50%;
      background: var(--amber); box-shadow: 0 0 12px var(--amber);
    }
    .brand-name {
      font-weight:600; letter-spacing:0.02em; font-size:18px;
    }
    .brand-name b { color: var(--amber); font-weight:600; }
    .brand-sub {
      font-family:"JetBrains Mono", monospace; font-size:11px;
      color: var(--ink-3); letter-spacing:0.18em; text-transform:uppercase;
    }
    .head-meta {
      display:flex; gap:24px; font-family:"JetBrains Mono", monospace; font-size:11px; color:var(--ink-2);
    }
    .head-meta div span { color:var(--ink-3); display:block; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:2px; }
    .head-meta b { color:var(--ink); font-weight:500; }

    /* ---------- Tabs ---------- */
    nav.tabs {
      display:flex; gap:0; padding: 14px 28px 0; border-bottom:1px solid var(--line);
      align-items: flex-end;
    }
    nav.tabs button {
      background: transparent; border:none;
      color: var(--ink-3); font-family: inherit; font-size: 13px; letter-spacing: 0.04em;
      padding: 10px 18px; cursor: pointer;
      border: 1px solid transparent; border-bottom: none;
      border-top-left-radius: 8px; border-top-right-radius: 8px;
      display:flex; align-items:center; gap:10px;
      position: relative; top: 1px;
    }
    nav.tabs button .num {
      font-family:"JetBrains Mono", monospace; font-size:10px; color:var(--ink-3);
      padding: 1px 6px; border:1px solid var(--line-2); border-radius: 4px;
    }
    nav.tabs button:hover { color: var(--ink-2); }
    nav.tabs button.active {
      color: var(--ink);
      background: var(--bg-2);
      border-color: var(--line);
      border-bottom: 1px solid var(--bg-2);
    }
    nav.tabs button.active .num { color: var(--amber); border-color: var(--amber); }

    .tab-spacer { flex:1; }
    .tab-aside {
      font-family:"JetBrains Mono", monospace; font-size:10px; color:var(--ink-3);
      letter-spacing:0.18em; text-transform:uppercase; padding-bottom: 12px;
    }

    /* ---------- Main view container ---------- */
    main#view { flex:1; overflow:hidden; background: var(--bg-2); position:relative; }
    .view-wrap { height:100%; display:grid; grid-template-columns: 320px 1fr; }

    /* ---------- Side panel ---------- */
    .side-panel {
      border-right: 1px solid var(--line);
      padding: 22px 22px 18px;
      background: var(--bg);
      overflow-y:auto;
      display:flex; flex-direction:column; gap: 18px;
    }
    .side-panel::-webkit-scrollbar { width: 6px; }
    .side-panel::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
    .panel-title {
      font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.22em;
      color: var(--amber);
    }
    .panel-sub { font-size:13px; color:var(--ink-2); margin-top:-10px; line-height:1.5; }
    .panel-section { display:flex; flex-direction:column; gap: 8px; }
    .panel-h {
      font-family:"JetBrains Mono", monospace; font-size:10px; letter-spacing:0.18em;
      color: var(--ink-3); text-transform: uppercase;
      padding-bottom: 6px; border-bottom: 1px solid var(--line);
    }
    .panel-empty { font-size: 12px; color: var(--ink-3); font-style: italic; }
    .panel-foot {
      margin-top:auto; padding-top: 14px; border-top:1px dashed var(--line);
      font-size:11px; color:var(--ink-3); font-family:"JetBrains Mono", monospace; line-height: 1.7;
    }

    .kbd {
      display:inline-block; padding:1px 6px; border:1px solid var(--line-2); border-radius:3px;
      font-family:"JetBrains Mono", monospace; font-size:10px; color:var(--ink-2);
      background: var(--bg-2);
    }
    .hint-row { font-size: 12px; color: var(--ink-2); display:flex; align-items:center; gap: 8px; padding: 3px 0; }

    /* Legend */
    .legend { display:flex; flex-direction:column; gap: 6px; }
    .legend-item {
      display:grid; grid-template-columns: 14px 1fr auto; align-items:center; gap:10px;
      font-size: 12px; color: var(--ink-2);
    }
    .legend-item .dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-item .name { color: var(--ink); }
    .legend-item .count { font-family:"JetBrains Mono", monospace; font-size: 10px; color: var(--ink-3); }

    /* Filter chips */
    .filter { display:flex; flex-wrap:wrap; gap: 6px; }
    .chip {
      display:inline-flex; align-items:center; gap:6px;
      background: var(--bg-2); border:1px solid var(--line);
      color: var(--ink-3); font-family: inherit; font-size: 11px;
      padding: 4px 8px; border-radius: 999px; cursor:pointer;
      transition: all 0.15s;
    }
    .chip .dot { width: 8px; height:8px; border-radius:50%; opacity: 0.5; }
    .chip.active { color: var(--ink); border-color: var(--line-2); background: var(--bg-3); }
    .chip.active .dot { opacity: 1; }
    .chip:hover { border-color: var(--line-2); }

    /* Toggles */
    .toggle { display:flex; align-items:center; gap:8px; font-size: 12px; color: var(--ink-2); cursor:pointer; padding: 2px 0; }
    .toggle input { accent-color: var(--amber); }

    /* Info card */
    .info-name {
      font-size: 14px; color: var(--ink); font-weight: 500;
      padding: 6px 10px; border-left: 3px solid var(--amber);
      background: var(--bg-2);
      line-height: 1.4;
    }
    .info-meta { display:grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 8px; }
    .info-meta > div { font-size: 11px; }
    .info-meta span { display:block; color: var(--ink-3); font-family:"JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 2px; }
    .info-meta b { color: var(--ink); font-weight: 500; }

    .drill-btn {
      margin-top: 12px;
      width: 100%; padding: 8px;
      background: var(--amber-soft); border: 1px solid var(--amber); color: var(--amber);
      font-family: inherit; font-size: 12px; letter-spacing: 0.06em; cursor:pointer;
      border-radius: 4px; text-transform: uppercase;
    }
    .drill-btn:hover { background: var(--amber); color: #1a1408; }

    /* ---------- Canvas / SVG ---------- */
    .canvas-wrap { position:relative; flex:1; min-height:0; height:100%; overflow:hidden; }
    .graph-svg { display:block; cursor: grab; }
    .graph-svg:active { cursor: grabbing; }

    .grid-bg line { stroke: var(--grid); stroke-width: 1; }
    .map-grid line { stroke: var(--grid-strong); }
    .map-grid line:nth-child(5n) { stroke: rgba(255, 200, 150, 0.06); }

    /* Compass */
    .rose-ring { fill: none; stroke: var(--line-2); }
    .rose-dot { fill: var(--amber); }
    .rose-tick { fill: var(--ink-3); font-family:"JetBrains Mono", monospace; font-size: 10px; letter-spacing:0.1em; }

    /* Hairball */
    .link { stroke-opacity: 0.18; transition: stroke-opacity 0.15s, stroke 0.15s, stroke-width 0.15s; }
    .link-intra { stroke: var(--ink-2); stroke-opacity: 0.18; }
    .link-sibling { stroke: var(--teal); stroke-opacity: 0.16; }
    .link-cross { stroke: var(--amber); stroke-opacity: 0.10; }
    .link-hub { stroke: var(--amber); stroke-opacity: 0.22; }
    .link.dim { stroke-opacity: 0.03 !important; }
    .link.active { stroke: var(--amber) !important; stroke-opacity: 0.9 !important; stroke-width: 1.4 !important; }
    .node { transition: opacity 0.15s, r 0.15s, stroke 0.15s; cursor: grab; }
    .node.dragging { cursor: grabbing; }
    .node:hover { stroke: var(--ink) !important; stroke-width: 1.6 !important; }
    .node.dim { opacity: 0.12; }
    .node.focus { stroke: var(--amber) !important; stroke-width: 2.2 !important; filter: drop-shadow(0 0 6px var(--amber)); }
    .node.neighbor { stroke: var(--ink) !important; stroke-width: 1.4 !important; }
    .node.pinned { stroke: var(--teal) !important; stroke-dasharray: 2 2; }
    .node-label {
      fill: var(--ink-2); font-family:"JetBrains Mono", monospace; font-size: 9px;
      pointer-events:none; text-anchor: middle;
      paint-order: stroke; stroke: var(--bg); stroke-width: 3px;
      opacity: 0; transition: opacity 0.15s;
    }
    .node-label.visible { opacity: 1; fill: var(--ink); }

    .panel-btn {
      margin-top: 10px; width: 100%; padding: 8px;
      background: var(--bg-2); border: 1px solid var(--line-2); color: var(--ink-2);
      font-family: inherit; font-size: 11px; letter-spacing: 0.06em; cursor: pointer;
      border-radius: 4px; text-transform: uppercase;
    }
    .panel-btn:hover { border-color: var(--amber); color: var(--amber); }

    /* Adaptive leaf highlight */
    .leaf.dim { opacity: 0.18; }
    .leaf.focus circle { stroke: var(--amber) !important; stroke-width: 2.5 !important; filter: drop-shadow(0 0 8px var(--amber)); }
    .leaf-link { stroke: var(--ink-2); stroke-opacity: 0.25; stroke-width: 1; transition: stroke-opacity 0.15s, stroke 0.15s; }
    .leaf-link.external { stroke: var(--amber); stroke-opacity: 0.35; stroke-dasharray: 4 4; }
    .leaf-link.dim { stroke-opacity: 0.05; }
    .leaf-link.active { stroke: var(--amber); stroke-opacity: 0.9; stroke-width: 1.6; }
    .leaf.ghost circle { transition: stroke 0.15s, filter 0.15s; }
    .leaf.ghost:hover circle { stroke: var(--amber) !important; filter: drop-shadow(0 0 6px var(--amber)); }
    .ghost-label { fill: var(--amber) !important; font-family: "JetBrains Mono", monospace; font-size: 10px !important; letter-spacing: 0.04em; }
    .ghost-count { fill: var(--ink-3); font-family: "JetBrains Mono", monospace; font-size: 9px; pointer-events: none; }
    .ext-badge { fill: #0b0a09; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,0.4); stroke-width: 0.4px; }

    /* Connections panel (top-right of L2 canvas) */
    .conn-panel {
      position: absolute; top: 14px; right: 14px;
      width: 320px; max-height: calc(100% - 28px);
      background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.7);
      display: flex; flex-direction: column;
      z-index: 5;
      overflow: hidden;
    }
    .conn-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 14px 14px 10px; border-bottom: 1px solid var(--line);
      background: var(--bg-2);
    }
    .conn-title { border-left: 3px solid var(--amber); padding: 2px 0 2px 10px; flex: 1; min-width: 0; }
    .conn-name-lg { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.3; }
    .conn-meta-row { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--ink-3); margin-top: 4px; letter-spacing: 0.06em; display: flex; gap: 6px; flex-wrap: wrap; }
    .conn-meta-row .ext { color: var(--amber); }
    .conn-meta-row .sep { color: var(--line-2); }
    .conn-close {
      background: transparent; border: 1px solid var(--line-2); color: var(--ink-3);
      width: 24px; height: 24px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 16px; line-height: 1; padding: 0;
    }
    .conn-close:hover { color: var(--amber); border-color: var(--amber); }

    .conn-body { padding: 10px 12px 14px; overflow-y: auto; }
    .conn-body::-webkit-scrollbar { width: 6px; }
    .conn-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    .conn-section { margin-bottom: 14px; }
    .conn-section-h {
      font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.18em;
      color: var(--ink-3); text-transform: uppercase;
      padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
    }
    .conn-group { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .conn-group-h {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; background: var(--bg-2);
    }
    .conn-group-cl { font-size: 12px; color: var(--ink); font-weight: 500; }
    .conn-group-dom { font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
    .conn-jump {
      margin-left: auto; background: transparent; border: 1px solid var(--line-2); color: var(--ink-2);
      width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1;
    }
    .conn-jump:hover { border-color: var(--amber); color: var(--amber); }

    .conn-list { list-style: none; padding: 4px 0; margin: 0; }
    .conn-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px; font-size: 12px; color: var(--ink-2);
      cursor: pointer; border-radius: 3px;
    }
    .conn-item:hover { background: var(--bg-2); color: var(--ink); }
    .conn-name { line-height: 1.3; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .conn-dot.lg { width: 12px; height: 12px; }
    .conn-empty { font-size: 12px; color: var(--ink-3); font-style: italic; padding: 4px 0; list-style: none; }
    .conn-empty.pad { padding: 6px 0 4px; }

    /* Adaptive */
    .agg-link { fill:none; stroke: var(--ink-2); stroke-opacity: 0.25; }
    .region-bg {
      transition: filter 0.2s, transform 0.2s;
      stroke-width: 1.2;
    }
    .region:hover .region-bg { filter: brightness(1.4); }
    .region.focus .region-bg { stroke-width: 2.2; filter: brightness(1.5); }
    .region.dim { opacity: 0.4; }
    .region-label {
      fill: var(--ink); font-size: 16px; font-weight: 500; pointer-events:none;
      paint-order: stroke; stroke: rgba(0,0,0,0.4); stroke-width: 3px;
    }
    .region-meta {
      fill: var(--ink-3); font-family:"JetBrains Mono", monospace; font-size: 10px;
      letter-spacing: 0.1em; pointer-events:none;
    }
    .region-cluster .region-label { font-size: 14px; }

    .leaf circle { transition: r 0.2s; }
    .leaf:hover circle { r: 12; stroke: var(--ink); }
    .leaf-label {
      fill: var(--ink); font-size: 11px; pointer-events:none;
      paint-order: stroke; stroke: var(--bg-2); stroke-width: 2.5px;
    }

    /* Adaptive main column */
    .adaptive-main { display:flex; flex-direction:column; min-height:0; position:relative; }

    .breadcrumb-bar {
      display:flex; align-items:center; gap: 4px; flex-wrap: wrap;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
      min-height: 48px;
    }
    .crumb {
      background: transparent; border: 1px solid transparent; color: var(--ink-2);
      font-family: inherit; font-size: 13px; padding: 5px 10px; border-radius: 4px;
      cursor:pointer;
    }
    .crumb:hover { background: var(--bg); border-color: var(--line); color: var(--ink); }
    .crumb.current { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
    .crumb-sep { color: var(--ink-3); font-size: 16px; padding: 0 2px; }

    .history-trail {
      margin-left:auto; display:flex; align-items:center; gap: 6px;
      padding: 4px 10px; border: 1px dashed var(--line); border-radius: 999px;
    }
    .trail-label {
      font-family:"JetBrains Mono", monospace; font-size: 9px; color: var(--ink-3);
      letter-spacing: 0.15em; text-transform: uppercase; margin-right: 4px;
    }
    .trail-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ink-3); opacity: 0.7;
    }
    .trail-dot.d0 { background: var(--ink-3); }
    .trail-dot.d1 { background: var(--teal); }
    .trail-dot.d2 { background: var(--amber); }

    .layer-pill {
      display:inline-block; align-self: flex-start;
      padding: 5px 10px; border: 1px solid var(--amber); color: var(--amber); background: var(--amber-soft);
      border-radius: 4px; font-family:"JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.15em;
    }
    .layer-explain { font-size: 12px; color: var(--ink-2); line-height: 1.5; margin-top: 2px; }

    .zoom-controls {
      position: absolute; bottom: 22px; right: 22px;
      display:flex; flex-direction: column; gap: 4px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .zoom-controls button {
      width: 32px; height: 32px; background: transparent; color: var(--ink-2);
      border:none; cursor:pointer; font-size: 14px; border-radius: 3px;
      font-family: inherit;
    }
    .zoom-controls button:hover { background: var(--bg-2); color: var(--amber); }

    /* ── Sensemaking view ── */
    .sm-sort-btn {
      background: var(--bg-2); border: 1px solid var(--line); color: var(--ink-3);
      font-family: inherit; font-size: 10px; padding: 3px 9px; border-radius: 4px;
      cursor: pointer; letter-spacing: 0.04em; transition: all 0.12s;
    }
    .sm-sort-btn:hover { border-color: var(--line-2); color: var(--ink-2); }
    .sm-sort-btn.active { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }

    .sm-view-btn {
      background: transparent; border: 1px solid transparent; color: var(--ink-3);
      font-family: inherit; font-size: 12px; padding: 6px 14px; border-radius: 4px;
      cursor: pointer; letter-spacing: 0.04em; transition: all 0.12s;
    }
    .sm-view-btn:hover { color: var(--ink-2); }
    .sm-view-btn.active { background: var(--bg-2); border-color: var(--line); color: var(--ink); }

    #sm-search {
      width: 100%; padding: 6px 10px;
      background: var(--bg-2); border: 1px solid var(--line-2);
      color: var(--ink); font-family: inherit; font-size: 12px;
      border-radius: 4px; outline: none; margin-bottom: 6px;
      transition: border-color 0.12s;
    }
    #sm-search:focus { border-color: var(--amber); }
    #sm-search::placeholder { color: var(--ink-3); }

    #sm-rank-list { max-height: 275px; overflow-y: auto; }
    #sm-rank-list::-webkit-scrollbar { width: 4px; }
    #sm-rank-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }

    .sm-rank-item {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 6px; border-radius: 4px; cursor: pointer;
      font-size: 11px; color: var(--ink-2);
      border-left: 2px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }
    .sm-rank-item:hover { background: var(--bg-2); color: var(--ink); }
    .sm-rank-selected { background: var(--bg-2); color: var(--ink); }
    .sm-rank-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sm-rank-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sm-rank-badge {
      font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--ink-3);
      padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; flex-shrink: 0;
    }
    .sm-rank-selected .sm-rank-badge { border-color: var(--amber); color: var(--amber); }

    .sm-tooltip {
      background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px;
      padding: 10px 14px; font-size: 12px; color: var(--ink); max-width: 250px;
      box-shadow: var(--shadow); line-height: 1.5;
    }

    .sm-stats-panel {
      position: absolute; bottom: 16px; left: 16px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; padding: 10px 14px;
      font-size: 11px; font-family: "JetBrains Mono", monospace;
      color: var(--ink-2); letter-spacing: 0.06em; line-height: 1.75;
    }
    .sm-stat-head {
      color: var(--amber); font-size: 9px; letter-spacing: 0.18em; margin-bottom: 5px;
    }
    .sm-stat-sep { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); }

    .sm-legend-panel {
      position: absolute; top: 12px; left: 12px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px 12px;
      font-size: 10px; font-family: "JetBrains Mono", monospace;
      color: var(--ink-3); letter-spacing: 0.06em; line-height: 1.8;
    }
    .sm-leg-row { display: flex; align-items: center; gap: 8px; }
    .sm-leg-line {
      display: inline-block; width: 22px; height: 1.5px; border-radius: 1px; flex-shrink: 0;
    }
    .sm-leg-dash {
      background: none !important;
      border-top: 1.5px dashed var(--amber);
    }

    /* ── Selected-node info chips (left panel) ── */
    .sm-info-block { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .sm-info-k {
      font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.12em;
      color: var(--ink-3); width: 100%; margin-bottom: 2px;
    }
    .sm-chip {
      font-size: 10px; padding: 2px 6px; border: 1px solid var(--line-2);
      border-radius: 3px; color: var(--ink-2); line-height: 1.4;
    }

    /* ── Edge-kind legend (matrix top) ── */
    .sm-kind-legend {
      display: flex; flex-wrap: wrap; gap: 14px; padding: 6px 10px 8px;
      font-size: 11px; color: var(--ink-2); border-bottom: 1px solid var(--line);
    }
    .sm-kind-item { display: flex; align-items: center; gap: 6px; }
    .sm-kind-sw { width: 14px; height: 3px; border-radius: 2px; }
    .sm-kind-desc { color: var(--ink-3); font-size: 10px; }

    /* ── Split layout: matrix ½ · detail table ½ ── */
    .sm-split { display: flex; height: 100%; width: 100%; }
    .sm-matrix-pane {
      flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--line); overflow: hidden;
    }
    .sm-matrix-scroll { flex: 1; overflow: auto; padding: 6px 10px; }
    .sm-matrix-scroll::-webkit-scrollbar { width: 7px; height: 7px; }
    .sm-matrix-scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    /* Matrix / Chord mode toggle */
    .sm-matrix-toolbar { padding: 8px 10px 2px; }
    .sm-mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .sm-mode-toggle button {
      background: transparent; border: none; color: var(--ink-3);
      font-family: inherit; font-size: 11px; letter-spacing: 0.03em;
      padding: 4px 12px; cursor: pointer; transition: all 0.12s;
    }
    .sm-mode-toggle button + button { border-left: 1px solid var(--line); }
    .sm-mode-toggle button:hover { color: var(--ink-2); }
    .sm-mode-toggle button.active { background: var(--bg-3); color: var(--amber); }

    /* Chord diagram */
    .chord-arc { cursor: pointer; transition: opacity 0.15s; }
    .chord-arc:hover { filter: brightness(1.25); }
    .chord-ribbon { transition: fill-opacity 0.15s; }
    .chord-ribbon:hover { fill-opacity: 0.85 !important; }
    .chord-label { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.02em; transition: opacity 0.15s; }
    .chord-band { cursor: default; }

    /* Hierarchical edge bundling */
    .heb-link { cursor: pointer; transition: stroke-opacity 0.15s; }
    .heb-node text { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.02em; transition: opacity 0.15s; }
    .heb-node:hover text { fill: var(--ink); }
    /* ── Tiles pane (matrix right half) ── */
    .sm-tiles-pane {
      flex: 1 1 50%; min-width: 0; overflow: hidden;
      display: flex; flex-direction: column; background: var(--bg);
    }
    .sm-tiles-head {
      padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2);
      display: flex; flex-direction: column; gap: 8px;
    }
    .sm-tiles-row { display: flex; gap: 8px; align-items: center; }
    .sm-tiles-row #sm-search { flex: 1; margin-bottom: 0; }
    .sm-tiles-context {
      display: flex; align-items: center; gap: 10px;
      font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em;
    }
    .sm-ctx-label { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sm-ctx-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .sm-ctx-x { color: var(--ink-3); }
    .sm-tiles-clear {
      margin-left: auto; flex-shrink: 0;
      background: transparent; border: 1px solid var(--line-2); color: var(--ink-3);
      font-family: inherit; font-size: 10px; padding: 2px 8px; border-radius: 999px; cursor: pointer;
    }
    .sm-tiles-clear:hover { border-color: var(--amber); color: var(--amber); }

    .sm-tiles-grid {
      flex: 1; overflow-y: auto; padding: 12px 14px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
      gap: 10px; align-content: start;
    }
    .sm-tiles-grid::-webkit-scrollbar { width: 7px; }
    .sm-tiles-grid::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
    .sm-tiles-empty { grid-column: 1 / -1; color: var(--ink-3); font-size: 12px; font-style: italic; padding: 10px 2px; }

    .sm-tile {
      border: 1px solid var(--line); border-left: 3px solid var(--ink-2); border-radius: 8px;
      padding: 9px 10px; background: var(--bg-2); cursor: pointer;
      display: flex; flex-direction: column; gap: 6px; transition: background 0.1s, border-color 0.1s;
    }
    .sm-tile:hover { background: var(--bg-3); border-color: var(--line-2); }
    .sm-tile-top { display: flex; align-items: center; gap: 6px; }
    .sm-tile-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .sm-tile-deg {
      margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--ink-3);
      border: 1px solid var(--line); border-radius: 3px; padding: 0 5px;
    }
    .sm-tile-title {
      font-size: 12px; color: var(--ink); line-height: 1.34; font-weight: 500;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .sm-tile:hover .sm-tile-title { color: var(--amber); }
    .sm-tile-meta { font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--ink-3); letter-spacing: 0.03em; }
    .sm-tile-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .sm-tile-chip {
      font-size: 9px; padding: 1px 5px; border: 1px solid var(--line-2); border-radius: 3px;
      color: var(--ink-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sm-tile-via {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      margin-top: 2px; padding-top: 6px; border-top: 1px dashed var(--line);
    }
    .sm-tile-via-k {
      font-family: "JetBrains Mono", monospace; font-size: 8px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-3); margin-right: 2px;
    }
    .sm-tile-via-chip {
      font-size: 9px; padding: 1px 5px; border: 1px solid var(--amber); border-radius: 3px;
      color: var(--amber); background: oklch(0.78 0.15 65 / 0.08);
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Egonet: layered node-card graph ── */
    .ego-breadcrumb {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 6;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 7px 10px; background: oklch(0.16 0.01 65 / 0.86); backdrop-filter: blur(4px);
      border: 1px solid var(--line); border-radius: 8px;
      pointer-events: none;   /* let clicks fall through to cards; crumbs re-enable below */
    }
    .ego-breadcrumb .ego-bc-crumb { pointer-events: auto; }
    .ego-bc-label {
      font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.18em;
      color: var(--ink-3); margin-right: 4px;
    }
    .ego-bc-crumb {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--line); color: var(--ink-2);
      font-family: inherit; font-size: 11px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    }
    .ego-bc-crumb:hover { border-color: var(--line-2); color: var(--ink); }
    .ego-bc-crumb.current { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
    .ego-bc-dot { width: 8px; height: 8px; border-radius: 50%; }
    .ego-bc-sep { color: var(--ink-3); font-size: 12px; }

    .ego-card-inner { width: 100%; height: 100%; }
    .ego-node-root, .ego-node-prop, .ego-node-nb { overflow: visible; }

    .ego-root-card {
      height: 100%; box-sizing: border-box; padding: 11px 12px;
      background: var(--bg-2); border: 2px solid var(--amber); border-radius: 10px;
      display: flex; flex-direction: column; gap: 5px; box-shadow: var(--shadow);
    }
    .ego-card-head { display: flex; align-items: center; gap: 8px; }
    .ego-card-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .ego-card-deg {
      margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--amber);
      border: 1px solid var(--amber); border-radius: 3px; padding: 0 5px;
    }
    .ego-root-title { font-size: 12px; color: var(--ink); font-weight: 500; line-height: 1.35; }
    .ego-card-sub { font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--ink-3); letter-spacing: 0.04em; }
    .ego-card-props { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
    .ego-prop-line { font-size: 10px; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; line-height: 1.3; }
    .ego-gly { color: var(--amber); flex-shrink: 0; }

    .ego-prop-node {
      height: 100%; box-sizing: border-box;
      display: flex; align-items: center; gap: 8px; padding: 0 12px;
      background: var(--bg-3); border: 1px solid var(--line-2); border-radius: 999px;
    }
    .ego-prop-glyph {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--amber-soft); color: var(--amber); font-size: 12px; flex-shrink: 0;
    }
    .ego-prop-name { font-size: 12px; color: var(--ink); font-weight: 500; }
    .ego-prop-n {
      margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--ink-3);
    }

    .ego-nb-card {
      height: 100%; box-sizing: border-box; padding: 7px 10px;
      background: var(--bg-2); border: 1px solid var(--line); border-left: 3px solid var(--ink-2);
      border-radius: 7px; display: flex; flex-direction: column; gap: 4px;
    }
    .ego-nb-card:hover { border-color: var(--line-2); background: var(--bg-3); }
    .ego-nb-card.is-expanded { background: var(--bg-3); box-shadow: inset 2px 0 0 var(--amber); }
    .ego-nb-top { display: flex; align-items: center; gap: 7px; }
    /* expand / collapse state badge on cards */
    .ego-exp-badge {
      font-family: "JetBrains Mono", monospace; font-size: 9px; line-height: 1;
      min-width: 16px; height: 15px; padding: 0 4px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber); flex-shrink: 0;
    }
    .ego-root-card .ego-exp-badge { margin-left: 4px; }
    .ego-nb-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--ink); }
    .ego-nb-deg {
      font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--ink-3);
      border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; flex-shrink: 0;
    }
    .ego-nb-vias { display: flex; gap: 4px; flex-wrap: wrap; overflow: hidden; max-height: 16px; }
    .ego-via-chip {
      font-size: 9px; padding: 1px 5px; border: 1px solid var(--line-2); border-radius: 3px;
      color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ego-nb-more {
      height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
      border: 1px dashed var(--line-2); border-radius: 7px; color: var(--ink-3);
      font-family: "JetBrains Mono", monospace; font-size: 10px; text-align: center; padding: 0 8px;
    }

    .ego-legend {
      position: absolute; bottom: 14px; left: 14px; z-index: 6;
      background: oklch(0.16 0.01 65 / 0.9); backdrop-filter: blur(4px);
      border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
      font-size: 10px; color: var(--ink-2); line-height: 1.5; max-width: 220px;
    }
    .ego-leg-row { display: flex; align-items: center; gap: 8px; }
    .ego-leg-sw { width: 16px; height: 3px; border-radius: 2px; flex-shrink: 0; }
    .ego-leg-desc { color: var(--ink-3); }
    .ego-leg-gly { width: 16px; text-align: center; color: var(--amber); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-head">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name"><b>ATLAS</b> · Energy Knowledge Graph</div>
          <div class="brand-sub">Topology · Datasets · Cross-Domain Linkage</div>
        </div>
      </div>
      <div class="head-meta" id="head-stats"></div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="hairball">
        <span class="num">01</span>
        <span>Network · Hairball</span>
      </button>
      <button class="tab-btn" data-tab="adaptive">
        <span class="num">02</span>
        <span>Adaptive Map</span>
      </button>
      <button class="tab-btn" data-tab="sensemaking">
        <span class="num">03</span>
        <span>Sensemaking</span>
      </button>
      <div class="tab-spacer"></div>
      <div class="tab-aside" id="tab-aside-meta">live · NFDI4Energy LDM</div>
    </nav>

    <main id="view"></main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
