services:
  atlas:
    build:
      context: .
      args:
        # Read from a local .env file (see .env.example) so the real endpoint
        # never ends up committed to git. Falls back to the config.js
        # placeholder if .env is missing.
        VITE_SPARQL_ENDPOINT: ${VITE_SPARQL_ENDPOINT:-https://YOUR-VIRTUOSO-HOST/sparql}
        VITE_SPARQL_GRAPH: ${VITE_SPARQL_GRAPH:-urn:your-graph}
    restart: unless-stopped
    ports:
      # Host port that IT's reverse proxy will target. Change the left side
      # to whatever port is free/assigned on the server; leave the right
      # side (80) alone — that's nginx inside the container.
      - "8091:80"
    volumes:
      # The generated dataset lives on the host, not in the image, so a data
      # refresh is just "replace these files" — no rebuild/redeploy needed.
      # Generate them locally with `npm run build-kg`, then copy this whole
      # public/ folder onto the server next to this compose file.
      - ./public/kg-data.json:/usr/share/nginx/html/kg-data.json:ro
      - ./public/kg-keywords.json:/usr/share/nginx/html/kg-keywords.json:ro
